{% extends 'base.html' %}
{% block head %}
<title>Hal Fiyat Tablosu Oluşturucu</title>
{% endblock %}
{% block body %}
    <h1>Tablo başarıyla Oluşturuldu.</h1>
    <img src="{{ url_for('static', filename='yazili_resim.png') }}" width="600" alt="">
    <br>
    
   <button id="downloadBtn" class="indir">Resmi İndir</button>
    <br><br><a href="/">Ana sayfaya dön</a>

    <script>
  document.getElementById('downloadBtn').addEventListener('click', function () {
    const link = document.createElement('a');
    link.href = '../static/yazili_resim.png'; // İndirilecek dosyanın URL’si (aynı klasördeyse direkt dosya adı yazabilirsin)
    link.download = 'tablo.png'; // Opsiyonel: indirilecek dosyanın ismi
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
</script>
